apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flipkart
  template:
    metadata:
      labels:
        app: flipkart
    spec:
      containers:
        - name: flipkart
          image: anishaflipkart27/flipkart_shopping_app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6080
---
apiVersion: v1
kind: Service
metadata:
  name: flipkart-service
spec:
  type: ClusterIP
  selector:
    app: flipkart
  ports:
    - port: 80
      targetPort: 6080
